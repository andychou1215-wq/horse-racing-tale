<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{% block title %}賽馬模擬遊戲 MVP{% endblock %}</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         max-width: 900px; margin: 24px auto; padding: 0 16px; color: #222; background: #fafafa; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 28px; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 0.9rem; }
  th { background: #f0f0f0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .money { font-weight: bold; color: #1a6b1a; }
  .money.low { color: #b3261e; }
  form.inline { display: inline; }
  select { padding: 3px; }
  button { padding: 6px 14px; cursor: pointer; }
  .log { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; margin: 12px 0;
         font-size: 0.85rem; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.8rem; color: #fff; }
  .badge.S { background: #c9962c; } .badge.A { background: #4a8f3c; } .badge.B { background: #4a7ab0; }
  .badge.C { background: #b0824a; } .badge.D { background: #a04a4a; }
  .note { color: #b3621e; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="{{ url_for('dashboard') }}" style="text-decoration:none; color:inherit;">
      <h1>🐎 賽馬模擬遊戲 — MVP網頁原型</h1>
    </a>
    <div>
      <a href="{{ url_for('dashboard') }}"><button type="button">回馬房總覽</button></a>
      <a href="{{ url_for('trainers_page') }}"><button type="button">訓練師市場</button></a>
      <a href="{{ url_for('vets_page') }}"><button type="button">獸醫市場</button></a>
      <a href="{{ url_for('facilities_page') }}"><button type="button">設施升級</button></a>
      <a href="{{ url_for('horse_market_page') }}"><button type="button">馬匹市場</button></a>
      <a href="{{ url_for('breeding_page') }}"><button type="button">繁殖</button></a>
      <form class="inline" method="post" action="{{ url_for('save_game_route') }}">
        <button type="submit">儲存</button>
      </form>
      <form class="inline" method="post" action="{{ url_for('load_game_route') }}"
            onsubmit="return confirm('確定要捨棄尚未儲存的變更並讀取存檔嗎？');">
        <button type="submit">讀取</button>
      </form>
      <form class="inline" method="post" action="{{ url_for('new_game_route') }}"
            onsubmit="return confirm('確定要覆蓋目前存檔並重新開局嗎？');">
        <button type="submit">新遊戲</button>
      </form>
      <form class="inline" method="post" action="{{ url_for('delete_save_route') }}"
            onsubmit="return confirm('確定永久刪除目前存檔嗎？這個操作無法復原。');">
        <button type="submit">刪除存檔</button>
      </form>
    </div>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="log">{% for m in messages %}{{ m }}
{% endfor %}</div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
